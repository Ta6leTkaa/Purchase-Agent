services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: purchase_agent
      POSTGRES_USER: purchase_agent
      POSTGRES_PASSWORD: purchase_agent
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - purchase_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchase_agent -d purchase_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      STORAGE_BACKEND: database
      DATABASE_URL: postgresql+asyncpg://purchase_agent:purchase_agent@postgres:5432/purchase_agent
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      STORAGE_BACKEND: database
      DATABASE_URL: postgresql+asyncpg://purchase_agent:purchase_agent@postgres:5432/purchase_agent
      API_KEY: ${API_KEY:?Set API_KEY in .env before starting the API}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env before starting the API}
      APP_DEBUG: ${APP_DEBUG:-false}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-120}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      API_RATE_LIMIT_MAX_CLIENTS: ${API_RATE_LIMIT_MAX_CLIENTS:-10000}
      TRAIN_PROVIDER_BASE_URL: ${TRAIN_PROVIDER_BASE_URL:-}
      TRAIN_PROVIDER_BEARER_TOKEN: ${TRAIN_PROVIDER_BEARER_TOKEN:-}
      TRAIN_PROVIDER_TIMEOUT_SECONDS: ${TRAIN_PROVIDER_TIMEOUT_SECONDS:-15}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/ready').read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    profiles: ["worker"]
    build:
      context: .
    restart: unless-stopped
    command:
      - python
      - -m
      - app.cli
      - worker
    environment:
      STORAGE_BACKEND: database
      DATABASE_URL: postgresql+asyncpg://purchase_agent:purchase_agent@postgres:5432/purchase_agent
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
      WORKER_CLAIM_TIMEOUT_SECONDS: ${WORKER_CLAIM_TIMEOUT_SECONDS:-900}
      WORKER_INSTANCE_ID: ${MISSION_WORKER_INSTANCE_ID:-mission-worker-1}
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-60}
      TRAIN_PROVIDER_BASE_URL: ${TRAIN_PROVIDER_BASE_URL:-}
      TRAIN_PROVIDER_BEARER_TOKEN: ${TRAIN_PROVIDER_BEARER_TOKEN:-}
      TRAIN_PROVIDER_TIMEOUT_SECONDS: ${TRAIN_PROVIDER_TIMEOUT_SECONDS:-15}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.cli
        - worker-health
        - --worker-kind
        - mission
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  notification-worker:
    profiles: ["notifications"]
    build:
      context: .
    restart: unless-stopped
    command:
      - python
      - -m
      - app.cli
      - notification-worker
    environment:
      STORAGE_BACKEND: database
      DATABASE_URL: postgresql+asyncpg://purchase_agent:purchase_agent@postgres:5432/purchase_agent
      NOTIFICATION_WORKER_POLL_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_POLL_INTERVAL_SECONDS:-5}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-100}
      NOTIFICATION_CLAIM_TIMEOUT_SECONDS: ${NOTIFICATION_CLAIM_TIMEOUT_SECONDS:-300}
      NOTIFICATION_RETRY_INITIAL_SECONDS: ${NOTIFICATION_RETRY_INITIAL_SECONDS:-30}
      NOTIFICATION_RETRY_MAX_SECONDS: ${NOTIFICATION_RETRY_MAX_SECONDS:-900}
      NOTIFICATION_MAX_DELIVERY_ATTEMPTS: ${NOTIFICATION_MAX_DELIVERY_ATTEMPTS:-5}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_BEARER_TOKEN: ${NOTIFICATION_WEBHOOK_BEARER_TOKEN:-}
      NOTIFICATION_WEBHOOK_SIGNING_SECRET: ${NOTIFICATION_WEBHOOK_SIGNING_SECRET:-}
      NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS: ${NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS:-10}
      WORKER_INSTANCE_ID: ${NOTIFICATION_WORKER_INSTANCE_ID:-notification-worker-1}
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.cli
        - worker-health
        - --worker-kind
        - notification
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  purchase_agent_postgres_data:
